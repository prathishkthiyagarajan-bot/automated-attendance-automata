services:
  - type: web
    name: automated-attendance-automata
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: attendance_system
      - key: NO_BROWSER
        value: "1"
